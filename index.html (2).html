/* ===== Lobby premium: salão elegante em verde profundo e latão dourado ===== */
.screen.menu{max-width:1540px;width:100%;gap:0}
.screen.menu .scroll.lobby-scroll{position:relative;display:block;overflow:auto;padding:clamp(18px,3.1vw,42px);border:1px solid rgba(216,180,91,.42);border-radius:24px;background:linear-gradient(90deg,rgba(4,14,9,.96) 0%,rgba(5,17,10,.83) 37%,rgba(5,16,10,.38) 69%,rgba(3,13,8,.67) 100%),linear-gradient(0deg,rgba(3,12,8,.76),transparent 45%),var(--lobby-art) center 58%/cover #07140e;box-shadow:inset 0 0 90px rgba(0,0,0,.34),0 18px 50px #0007;scrollbar-width:thin;scrollbar-color:#95753b transparent}
.lobby-shell{min-height:100%;width:100%;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.lobby-top{display:flex;align-items:center;justify-content:space-between;gap:22px}
.lobby-brand{display:flex;align-items:center;gap:13px;text-shadow:0 2px 12px #000}
.lobby-mark{width:52px;height:52px;border:1px solid #d8b45b;border-radius:50%;display:grid;place-items:center;color:#f2d88e;background:linear-gradient(145deg,#213d2a,#08150d);box-shadow:0 0 0 4px #d8b45b20,inset 0 0 15px #d8b45b25}
.lobby-mark b{font:400 28px/1 var(--display);border:1px solid #e1c578;border-radius:50%;width:31px;height:31px;display:grid;place-items:center}
.lobby-brand small{display:block;font-size:10px;letter-spacing:.28em;color:#d7c99b;font-weight:800}
.lobby-brand strong{display:block;font:700 22px/1.1 Georgia,'Times New Roman',serif;letter-spacing:.12em;color:#f4ead0}
.lobby-brand strong i{font-style:normal;color:#d8b45b}
.lobby-user{width:min(360px,48%)}
.lobby-user .hero{min-height:0;padding:10px 12px;gap:10px;border-radius:16px;background:rgba(7,19,12,.83)!important;border:1px solid #d8b45b65;box-shadow:0 8px 28px #0005;backdrop-filter:blur(10px)}
.lobby-user .av{width:48px!important;height:48px!important;font-size:20px!important}
.lobby-user .hinfo{gap:3px}.lobby-user .hname{font-size:18px}.lobby-user .hlvl{font-size:12px}.lobby-user .hlvl span{font-size:11px}.lobby-user .bar{height:6px}.lobby-user .hcoins{margin-top:1px}.lobby-user .chip{padding:3px 9px;font-size:12px;background:#0007}
.lobby-content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,350px);align-items:center;gap:clamp(28px,7vw,110px);padding:20px clamp(4px,4vw,72px)}
.lobby-copy{max-width:590px;text-shadow:0 3px 20px #000b}
.lobby-kicker{display:flex;align-items:center;gap:9px;color:#e4ca84;font-size:11px;font-weight:900;letter-spacing:.24em}
.lobby-kicker i,.lobby-footer>span:first-child i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d8b45b;box-shadow:0 0 12px #e6c772}
.lobby-copy h2{margin:12px 0 8px;font:400 clamp(40px,6.5vw,76px)/.98 Georgia,'Times New Roman',serif;letter-spacing:.015em;color:#fff8e8;text-shadow:0 5px 24px #000b}
.lobby-copy h2 em{font-style:normal;color:#e0bf69}
.lobby-copy p{margin:14px 0 24px;color:#e2e4d5;font-size:15px;line-height:1.6;font-weight:700;text-shadow:0 2px 9px #000}
.btn.lobby-play{position:relative;width:min(100%,370px);min-height:78px;display:flex;align-items:center;justify-content:flex-start;gap:15px;padding:15px 22px;border:1px solid #ffedac;border-radius:14px;background:linear-gradient(120deg,#f1d17a,#bd9140 75%,#92702d);box-shadow:0 7px 0 #563f17,0 13px 32px #0008;color:#201807;text-align:left;text-shadow:none;letter-spacing:.11em}
.btn.lobby-play>span{font:700 25px/1 Georgia,'Times New Roman',serif;letter-spacing:.18em}.btn.lobby-play>b{margin-left:auto;font-size:25px}.btn.lobby-play>small{position:absolute;left:24px;bottom:8px;font-size:8px;letter-spacing:.19em;font-weight:900;opacity:.76}
.lobby-nav{padding:14px;border:1px solid #d8b45b4d;border-radius:18px;background:rgba(5,17,11,.76);box-shadow:0 12px 32px #0007;backdrop-filter:blur(12px)}
.lobby-nav-label{padding:1px 8px 10px;color:#d8c58b;font-size:10px;font-weight:900;letter-spacing:.22em}
.lobby-action{position:relative;width:100%;display:flex;align-items:center;gap:11px;min-height:54px;margin:2px 0;padding:7px 9px;text-align:left;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--fg);cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.lobby-action:hover,.lobby-action:focus-visible{background:#fff1;border-color:#d8b45b55}.lobby-action:active{transform:scale(.985)}

/* Jogo mobile em coluna única: menus em cartões escuros, mesa de sinuca ocupando a tela na partida. Dourado = moeda e ação principal. */
:root{

  display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

button{font:inherit;color:inherit}

.top{display:flex;align-items:center;gap:10px}

.rdmsg{min-height:22px;font-weight:800;color:var(--muted)}.rdmsg.bad{color:var(--bad)}
.mbtns{display:flex;gap:10px}.mbtns .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1d2650;border:1px solid var(--line);border-radius:14px;padding:11px 18px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.good{border-color:var(--good)}
/* ===== Modo paisagem persistente, inclusive com campos de texto/teclado visível ===== */
html.rot{overflow:hidden}
html.rot body{position:fixed;top:0;left:100%;width:100vh;height:100vw;width:100dvh;height:100dvw;transform:rotate(90deg);transform-origin:0 0;
  padding-top:max(12px,env(safe-area-inset-right,0px));padding-bottom:max(12px,env(safe-area-inset-left,0px));padding-left:max(16px,env(safe-area-inset-top,0px));padding-right:max(16px,env(safe-area-inset-bottom,0px))}
html.rot body:has(.screen.game){padding:max(5px,env(safe-area-inset-right,0px)) max(5px,env(safe-area-inset-bottom,0px)) max(5px,env(safe-area-inset-left,0px)) max(5px,env(safe-area-inset-top,0px))}
html:not(.rot) body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html:not(.rot) body:has(.screen.game){padding-left:max(5px,env(safe-area-inset-left,0px));padding-right:max(5px,env(safe-area-inset-right,0px))}
html.land body{padding-block:6px}
html.land body:has(.screen.game){padding-block:5px}
html.land .screen{gap:8px;max-width:980px}
html.land .screen.game{max-width:1600px;gap:4px}
html.land .top h1{font-size:20px}
html.land .btn.sq{width:38px;height:38px}
html.land .scroll{gap:10px;padding-bottom:8px}
html.land .hero{min-height:84px;padding:12px}
html.land .screen.menu .scroll{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:10px 14px;align-content:center}
html.land .screen.menu .hero{grid-column:1;grid-row:1}
html.land .screen.menu .btn.big{grid-column:1;grid-row:2;font-size:26px;padding:10px}
html.land .screen.menu .grid{grid-column:2;grid-row:1/3;gap:8px;align-content:center}
html.land .tile{flex-direction:row;align-items:center;padding:10px 12px;gap:8px;font-size:14px}
html.land .scroll.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
html.land .scroll.list .note{grid-column:1/-1}
html.land .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
html.land .cards{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
html.land #modal{padding:8px;overflow:auto}
html.land .mbox{max-height:100%;overflow:auto;padding:14px;gap:8px;max-width:440px}
html.land .mbox h2{font-size:26px}
html.land .mrows>div{padding:5px 10px}

<script>
/* ===== Motor: física, regras da Bola 8 e bot (sem DOM) ===== */
const R=14,TW=1000,TH=520,RAIL=46,PX0=RAIL,PY0=RAIL,PX1=TW-RAIL,PY1=TH-RAIL;
const POCKETS=[
  {x:PX0-4,y:PY0-4,r:29},{x:TW/2,y:PY0-2,r:27},{x:PX1+4,y:PY0-4,r:29},
  {x:PX0-4,y:PY1+4,r:29},{x:TW/2,y:PY1+2,r:27},{x:PX1+4,y:PY1+4,r:29}];
const BCOL=[null,'#f5c518','#1e4fd8','#d62828','#6a2fb0','#f07b12','#1a8f3c','#8a2323'];
function ballColor(n){return n===0?'#f4f4f4':n===8?'#151515':BCOL[n>8?n-8:n]}
function typeOf(n){return n===0?'cue':n===8?'eight':n<8?'solid':'stripe'}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* Orientação 3D da bola (quaternion [w,x,y,z]): só visual, derivada do deslocamento */
function qmul(a,b){return [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]]}
function faceQ(rng){const h=rng()*3.1416,s=Math.SQRT1_2;return qmul([Math.cos(h),0,0,Math.sin(h)],[s,0,-s,0])}
function randQ(rng){const u=rng(),v=rng()*6.2832,w=rng()*6.2832,a=Math.sqrt(1-u),b=Math.sqrt(u);return [b*Math.cos(w),a*Math.sin(v),a*Math.cos(v),b*Math.sin(w)]}
function rollBall(b,dx,dy,d){
  const h=d/R/2,k=Math.sin(h)/d,q=qmul([Math.cos(h),dy*k,dx*k,0],b.q);
  const l=Math.hypot(q[0],q[1],q[2],q[3])||1;
  b.q=[q[0]/l,q[1]/l,q[2]/l,q[3]/l];b.rv=(b.rv|0)+1;
}
function newGame(rng){
  rng=rng||Math.random;
  const head={x:PX0+(PX1-PX0)*0.25,y:TH/2};
  const cue={n:0,type:'cue',x:head.x,y:head.y,vx:0,vy:0,out:false,q:randQ(rng),rv:0};
  const balls=[cue];
  const solids=shuffle([2,3,4,5,6,7],rng), stripes=shuffle([9,10,11,12,13,14,15],rng);
  const c1=solids.pop(), c2=stripes.pop();
  const rest=shuffle(solids.concat(stripes),rng);
  const order=[]; order[0]=1; order[4]=8; order[10]=c1; order[14]=c2;
  let k=0; for(let i=0;i<15;i++) if(order[i]===undefined) order[i]=rest[k++];
  const apexX=PX0+(PX1-PX0)*0.7; let idx=0, spot8=null;
  for(let r=0;r<5;r++) for(let c=0;c<=r;c++){
    const n=order[idx++];
    const b={n,type:typeOf(n),x:apexX+r*(2*R*0.866+0.8),y:TH/2+(c-r/2)*(2*R+0.8),vx:0,vy:0,out:false,q:faceQ(rng),rv:0};
    if(n===8) spot8={x:b.x,y:b.y};
    balls.push(b);
  }
  return {balls,cue,head,spot8,turn:0,groups:[null,null],mode:'aim',angle:0,power:0.55,
    shot:null,shots:0,winner:null,reason:'',falling:[],on:{},rng,spin:{x:0,y:0}};
}

const VMAX=2430; /* teto de segurança (px/s): taco normal chega a 1900; lendário no máx. ~2250 */
function startShot(G,angle,power,fb){
  power=Math.max(0.05,Math.min(1,+power||0.05));
  const v=Math.min(VMAX,140+power*1760*(1+(+fb||0))); /* fb = bônus de força do taco (0 = normal) */
  const sp=(G.turn===(G.human||0)&&G.spin)?G.spin:{x:0,y:0};
  G.cue.sx=sp.x||0; G.cue.sy=sp.y||0;
  G.cue.vx=Math.cos(angle)*v; G.cue.vy=Math.sin(angle)*v;
  G.shots++; G.shot={first:null,rail:false,pocketed:[],isBreak:G.shots===1};
  G.mode='moving';
}

function anyMoving(G){for(const b of G.balls) if(!b.out&&(b.vx||b.vy)) return true;return false}

function hitRail(G,b,v,nx,ny){
  if(b===G.cue&&b.sx&&v>0){const k=b.sx*0.35*v;b.vx+=-ny*k;b.vy+=nx*k;b.sx*=0.6}
  if(G.shot&&G.shot.first) G.shot.rail=true;
  if(G.on.rail) G.on.rail(v);
}
function pocketBall(G,b,p){
  if(b.out) return;
  const spd=Math.hypot(b.vx,b.vy); /* velocidade de entrada (só para o som) */
  b.out=true; b.vx=b.vy=0;
  if(G.shot) G.shot.pocketed.push(b);
  G.falling.push({b,x:b.x,y:b.y,p,t:0});
  if(G.on.pocket) G.on.pocket(spd);
}

let STEPN=0;
function step(G,dt){
  const bs=G.balls,sn=++STEPN;
  for(const b of bs){
    if(b.out) continue;
    if(!isFinite(b.x+b.y+b.vx+b.vy)){b.vx=b.vy=0;if(!isFinite(b.x+b.y)){b.x=G.head.x;b.y=G.head.y}}
    if(b.sx||b.sy){const dk=Math.exp(-0.7*dt);b.sx*=dk;b.sy*=dk}
    const sp=Math.hypot(b.vx,b.vy);
    if(sp>0){
      const ns=Math.max(0,sp-(150+0.45*sp)*dt);
      if(ns<6){b.vx=0;b.vy=0}else{const k=ns/sp;b.vx*=k;b.vy*=k}
    }

function targetOf(G,p){
  const g=G.groups[p]; if(!g) return 'open';
  return G.balls.some(b=>b.type===g&&!b.out)?g:'eight';
}
function validCuePos(G,x,y){
  if(x<PX0+R+2||x>PX1-R-2||y<PY0+R+2||y>PY1-R-2) return false;
  for(const p of POCKETS) if(Math.hypot(x-p.x,y-p.y)<p.r+R) return false;
  for(const b of G.balls) if(b!==G.cue&&!b.out&&Math.hypot(x-b.x,y-b.y)<2*R+1) return false;
  return true;
}
function nearestFree(G,x,y){
  if(validCuePos(G,x,y)) return {x,y};
  for(let rad=4;rad<420;rad+=4) for(let a=0;a<24;a++){
    const px=x+Math.cos(a/24*6.2832)*rad, py=y+Math.sin(a/24*6.2832)*rad;
    if(validCuePos(G,px,py)) return {x:px,y:py};
  }
  return {x:G.head.x,y:G.head.y};
}
function respot8(G,b){
  let x=G.spot8.x;
  for(let i=0;i<12;i++){
    if(!G.balls.some(o=>o!==b&&!o.out&&Math.hypot(o.x-x,o.y-G.spot8.y)<2*R)) break;
    x+=2*R;
  }
  b.x=Math.min(x,PX1-R);b.y=G.spot8.y;b.out=false;b.vx=b.vy=0;
}

/* Regras: avalia a jogada depois que todas as bolas pararam */
function finishShot(G){
  const s=G.shot, me=G.turn, opp=1-me, cue=G.cue;
  let pocketed=s.pocketed.slice();
  const target=targetOf(G,me);
  let foul=false, reason='';
  const F=r=>{if(!foul){foul=true;reason=r}};
  const scratch=pocketed.includes(cue);
  if(scratch) F('Bola branca encaçapada');
  if(!s.first) F('Nenhuma bola foi atingida');
  else if(target==='open'){ if(s.first.type==='eight') F('Bola 8 atingida primeiro'); }
  else if(s.first.type!==target) F('Bola errada atingida primeiro');
  if(!foul&&!pocketed.length&&!s.rail) F('Nenhuma bola tocou a tabela');
  const eight=pocketed.find(b=>b.type==='eight');
  if(eight){
    if(s.isBreak){ respot8(G,eight); pocketed=pocketed.filter(b=>b!==eight); }
    else{
      const ok=!foul&&target==='eight';
      G.winner=ok?me:opp; G.mode='over'; G.shot=null;
      G.reason=ok?'Bola 8 encaçapada com sucesso':(target!=='eight'&&!foul?'Bola 8 encaçapada antes da hora':'Falta ao encaçapar a bola 8');
      return {winner:G.winner,reason:G.reason,pocketed};
    }
  }
  const real=pocketed.filter(b=>b.type==='solid'||b.type==='stripe');
  let assigned=false;
  if(!foul&&G.groups[me]===null&&real.length){
    const t=real[0].type; G.groups[me]=t; G.groups[opp]=t==='solid'?'stripe':'solid'; assigned=true;
  }
  const own=!!G.groups[me]&&real.some(b=>b.type===G.groups[me]);
  let next=me, bih=false;
  if(foul){next=opp;bih=true}
  else if(!own) next=opp;
  if(scratch){cue.out=false;cue.vx=cue.vy=0;cue.x=G.head.x;cue.y=G.head.y}
  G.turn=next; G.mode=bih?'place':'aim'; G.shot=null;
  if(bih){const f=nearestFree(G,G.head.x,G.head.y);cue.x=f.x;cue.y=f.y}
  return {foul,reason,assigned,own,next,bih,pocketed,prev:me};
}

/* Mira: primeiro ponto de contato da linha da bola branca */
function aimRay(G,ox,oy,ang){
  const dx=Math.cos(ang), dy=Math.sin(ang);
  let t=1e9, kind='wall', ball=null;
  if(dx>1e-6) t=Math.min(t,(PX1-R-ox)/dx); else if(dx<-1e-6) t=Math.min(t,(PX0+R-ox)/dx);
  if(dy>1e-6) t=Math.min(t,(PY1-R-oy)/dy); else if(dy<-1e-6) t=Math.min(t,(PY0+R-oy)/dy);
  for(const b of G.balls){
    if(b===G.cue||b.out) continue;
    const fx=ox-b.x, fy=oy-b.y, bq=fx*dx+fy*dy, cq=fx*fx+fy*fy-4*R*R, disc=bq*bq-cq;
    if(disc>=0){const tt=-bq-Math.sqrt(disc); if(tt>0&&tt<t){t=tt;kind='ball';ball=b}}

  return {t,kind,ball,x:ox+dx*t,y:oy+dy*t,dx,dy};
}

function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;

  return Math.hypot(px-(x1+u*dx),py-(y1+u*dy));
}
function blocked(G,x1,y1,x2,y2,ignore){

    if(segDist(b.x,b.y,x1,y1,x2,y2)<2*R*0.97) return true;
  }

}
function botTargets(G,p){
  const t=targetOf(G,p);

}
function candidateShots(G,cx,cy,targets){
  const out=[];

    const px=p.x+(p.x<TW/2?7:p.x>TW/2?-7:0), py=p.y+(p.y<TH/2?7:-7)*(p.x===TW/2?0.4:1);
    const dx=px-t.x, dy=py-t.y, dl=Math.hypot(dx,dy); if(dl<1) continue;
    const ux=dx/dl, uy=dy/dl, gx=t.x-ux*2*R, gy=t.y-uy*2*R;

    if(blocked(G,t.x,t.y,px,py,[G.cue,t])) continue;
    out.push({angle:Math.atan2(cdy,cdx),score:cos*100-cl*0.04-dl*0.05,dist:cl+dl,n:t.n});

}
function gauss(rng){return Math.sqrt(-2*Math.log(1-rng()))*Math.cos(6.2832*rng())}

  easy:{sig:7,pick:3,pn:0.14},

function botChoose(G,skill,rng){
  rng=rng||Math.random; const sk=SKILLS[skill]||SKILLS.medio, cue=G.cue;

  }else{

function botPlaceCue(G,rng){
  rng=rng||Math.random;

  for(let i=0;i<70;i++){

    if(sc>bs){bs=sc;best={x,y}}

}

/* ===== Progresso salvo ===== */
let KEY='sinuca-pool-v1';
let canSave=true;
const DEF=()=>({name:'Jogador',avatar:{i:0,photo:null},coins:5000,xp:0,level:1,wins:0,losses:0,played:0,pocketedTotal:0,winStreak:0,
  cues:['classic'],banners:['felt'],photos:[],cue:'classic',banner:'felt',daily:{last:'',streak:0},goals:{},codes:[],settings:{sound:true,guide:true}});
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r){const d=DEF();return Object.assign(d,r,{settings:Object.assign(d.settings,r.settings||{}),daily:Object.assign(d.daily,r.daily||{}),avatar:Object.assign(d.avatar,r.avatar||{})})}
  }catch(e){}
  return DEF();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));canSave=true}catch(e){canSave=false}}
let S=load();
const needXp=l=>100+(l-1)*60;
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const cueOf=id=>CUES.find(c=>c.id===id)||CUES[0];
const cueForce=id=>cueOf(id).fb||0, cueAim=id=>cueOf(id).ab||0;
const legStats=it=>`<div class="lgst"><span>Força <b>+${Math.round(it.fb*100)}%</b></span><span>Mira <b>+${Math.round(it.ab*100)}%</b></span></div>`;
const banOf=id=>BANNERS.find(b=>b.id===id)||BANNERS[0];
const bfx=b=>b.fx?'<i class="bfx" aria-hidden="true"><span class="fg"></span><span class="fb f1"></span><span class="fb f2"></span><span class="fb f3"></span><span class="fl"></span><span class="fr"></span><span class="sp s1"></span><span class="sp s2"></span></i>':'';
function gainXp(n){
  S.xp+=n; let up=0;
  while(S.xp>=needXp(S.level)){S.xp-=needXp(S.level);S.level++;S.coins+=250;up++}
  return up;
}
function localDate(off=0){const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dailyInfo(){
  const t=localDate(), y=localDate(-1), d=S.daily;
  if(d.last===t) return {can:false,day:d.streak};
  return {can:true,day:d.last===y?(d.streak%7)+1:1};
}

const topbar=(title,back='menu')=>`<header class="top"><button class="btn sq" data-go="${back}" aria-label="Voltar">${ic('back',22)}</button><h1>${title}</h1>${coinChip()}</header>`;
function avatar(size=64){
  const a=S.avatar, ch=(S.name||'J').trim().charAt(0).toUpperCase()||'J';
  const pf=a.pid&&PHOTOS.find(p=>p.id===a.pid);
  const st=pf?'':a.photo?`background-image:url(${a.photo});background-size:cover;background-position:center`:`background:${AVATARS[a.i%AVATARS.length]}`;
  return `<div class="av${pf?' phi-'+pf.id:''}" style="width:${size}px;height:${size}px;font-size:${size*.45}px;${st}">${pf||a.photo?'':ch}</div>`;
}
function heroCard(extra=''){
  const pct=Math.round(S.xp/needXp(S.level)*100);
  return `<div class="hero" style="background:${banOf(S.banner).bg}">${bfx(banOf(S.banner))}<div class="shade"></div>${avatar(68)}
  <div class="hinfo"><div class="hname">${esc(S.name)}</div><div class="hlvl">Nível ${S.level}<span> · ${S.xp}/${needXp(S.level)} XP</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>${extra}</div></div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

const hc=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const CODES={'1q5ybswz5m7':100000,'1zv4w5tkume':50000,'2fc44rn0ww6':10000,'ahkvv23035':200000,'m9tuggcvo2':1000000000};
CODES[hc('sp$CARMESTRE')]={kind:'xp',amount:1000000};
function redeemCode(raw){
  const code=String(raw||'').replace(/\s+/g,'').toUpperCase();
  if(!code)return {ok:false,msg:'Digite um código'};
  const h=hc('sp$'+code);
  if(!Object.prototype.hasOwnProperty.call(CODES,h))return {ok:false,msg:'Código inválido'};
  if(!Array.isArray(S.codes))S.codes=[];
  if(S.codes.includes(h))return {ok:false,msg:'Código já resgatado'};
  const reward=CODES[h],isXp=!!reward&&typeof reward==='object';
  const before=isXp?{xp:S.xp,level:S.level,coins:S.coins}:null;
  S.codes.push(h);
  let levels=0,val=reward;
  if(isXp){val=reward.amount;levels=gainXp(val)}else S.coins+=val;
  save();
  if(!canSave){
    S.codes.pop();
    if(isXp){S.xp=before.xp;S.level=before.level;S.coins=before.coins}else S.coins-=val;
    return {ok:false,msg:'Não foi possível salvar o resgate. Ative o armazenamento do navegador e tente de novo.'};
  }
  return {ok:true,val,kind:isXp?'xp':'coins',levels,level:S.level};
}

    if(k==='cues')S.cue=id;else if(k==='photos')S.avatar.pid=id;else S.banner=id;

  }
  if(d.equip){const [k,id]=d.equip.split(':');if(k==='cues')S.cue=id;else if(k==='photos'){if((S.photos||[]).includes(id))S.avatar.pid=id}else S.banner=id;save();refresh();return}
  if(d.av!==undefined){S.avatar.i=+d.av;S.avatar.photo=null;S.avatar.pid=null;save();refresh();return}
  if(d.set){S.settings[d.set]=!S.settings[d.set];save();refresh();return}
  if(d.goal){const g=GOALS.find(x=>x.id===d.goal);if(g.get(S)>=g.target&&!S.goals[g.id]){S.goals[g.id]=1;S.coins+=g.reward;save();sfx.coin();toast('+'+fmt(g.reward)+' moedas',true);refresh()}return}
  if(d.act==='redeem'){openRedeem();return}
  if(d.act==='daily'){const di=dailyInfo();if(di.can){const v=DAILY[di.day-1];S.daily={last:localDate(),streak:di.day};S.coins+=v;save();sfx.coin();toast('+'+fmt(v)+' moedas do bônus diário',true);refresh()}return}
  if(d.act==='reset'){
    if(!resetArm){resetArm=true;clearTimeout(resetTimer);resetTimer=setTimeout(()=>{resetArm=false;if(cur==='settings')refresh()},4000);refresh();return}
    resetArm=false;{const cd=S.codes;S=DEF();if(Array.isArray(cd))S.codes=cd}save();toast('Progresso apagado');go('menu');return;
  }

/* Bola na caçapa: 1) batida na borda/forro (estalo abafado) 2) queda (tum grave descendente) 3) rolagem oca no tubo

function pocketSound(sp){

  const k=Math.min(1,Math.pow(Math.max(40,sp||250)/900,.6)),t=a.currentTime,B=sbus(a);
  const dly=a.createDelay(.5),fb=a.createGain(),dl=a.createBiquadFilter(),wet=a.createGain(),dry=a.createGain();
  dly.delayTime.value=.085;fb.gain.value=.38;dl.type='lowpass';dl.frequency.value=1100;wet.gain.value=.45;
  dry.connect(B);dry.connect(dly);dly.connect(dl);dl.connect(fb);fb.connect(dly);dl.connect(wet);wet.connect(B);
  ballClick(Math.max(120,sp*.6),dry,0,.75);                       /* 1) borda/forro */
  const o=a.createOscillator(),og=a.createGain();                  /* 2) queda */
  o.type='sine';o.frequency.setValueAtTime(190,t+.03);o.frequency.exponentialRampToValueAtTime(58,t+.3);
  og.gain.setValueAtTime(.0001,t+.03);og.gain.linearRampToValueAtTime(.4*(.45+.55*k),t+.05);og.gain.exponentialRampToValueAtTime(.0005,t+.32);
  o.connect(og);og.connect(dry);o.start(t+.03);o.stop(t+.35);
  const ns=a.createBufferSource(),f=a.createBiquadFilter(),ng=a.createGain(),hb=a.createBiquadFilter(),hg=a.createGain(); /* 3) rolagem oca */
  ns.buffer=nbuf(a);f.type='lowpass';f.frequency.setValueAtTime(1400,t+.05);f.frequency.exponentialRampToValueAtTime(260,t+.6);
  ng.gain.setValueAtTime(.0001,t+.05);ng.gain.linearRampToValueAtTime(.3*(.4+.6*k),t+.12);ng.gain.exponentialRampToValueAtTime(.001,t+.65);
  hb.type='bandpass';hb.frequency.value=390;hb.Q.value=2.2;hg.gain.value=.6;
  ns.connect(f);f.connect(ng);ng.connect(dry);ns.connect(hb);hb.connect(hg);hg.connect(ng);ns.start(t+.05,Math.random()*.05,.62);

function onCue(p){

  const along=-(dx*ux+dy*uy),perp=Math.abs(-dx*uy+dy*ux);

  const w=toWorld(e);if(!onCue(w))return null;
  const gx=w.x-G.cue.x,gy=w.y-G.cue.y;

function ptr(e){

  if(cueGrab&&G.mode!=='aim')cueGrab=null;
  if(G.mode==='aim'){
    if(cueGrab){ /* arrastando o próprio taco: ele gira em torno da bola branca acompanhando o dedo */
      const gx=p.x-G.cue.x,gy=p.y-G.cue.y;
      if(Math.hypot(gx,gy)<40)return; /* perto demais da bola o ângulo oscila */
      const a=Math.atan2(gy,gx);

  else if(p.ph==='think'&&p.t>0.8){p.shot=botChoose(G,cfg.skill);p.a0=G.angle;p.ph='aim';p.t=0}

function mpCreate(){

function mpHostStart(net){
  net.mqs.forEach(mqDrop);net.mqs=[];net.open=false;
  net.base=MP_PREFIX+net.code;
  const gen=++net.gen,base=net.base,stale=()=>NET!==net||net.gen!==gen;
  let failed=0;
  MP_BROKERS.forEach(url=>{
    mqOpen(url,{
      will:base+'/room',
      onOpen:mq=>{
        if(stale()){mq.close();return}
        mq.base=base;net.mqs.push(mq);
        mq.sub(base+'/h');mq.sub(base+'/room');
        setTimeout(()=>{ /* se já existir uma sala retida com este código, sorteia outro */
          if(stale()||mq.dead)return;
          if(mq.clash){
            if(net.tries++<8){net.code=mpCode();mpMsg('Criando sala…');mpHostStart(net)}
            else{mpClose();mpMsg('Não foi possível gerar um código livre. Tente de novo.',true)}

function mpJoin(raw){

  };
  net.to=setTimeout(()=>{if(NET===net&&!MP){mpClose();mpMsg('Não foi possível entrar na sala. Confira o código e a internet.',true)}},16000);
  MP_BROKERS.forEach(url=>{
    let counted=false;const settle=()=>{if(!counted){counted=true;settled++;verdict()}};
    mqOpen(url,{
      onOpen:mq=>{
        if(stale()||net.found){mq.close();return}

        mq.sub(base+'/g');mq.sub(base+'/room');
        setTimeout(()=>{if(!stale()&&!net.found)settle()},1800);
      },
      onMsg:(mq,topic,w,ret)=>{

          net.to=setTimeout(()=>{if(NET===net&&!MP){mpClose();mpMsg('A sala não respondeu. Peça para o amigo criar uma nova sala.',true)}},9000);
          mpSend({t:'hi',v:MP_VER,p:myProfile()});

        try{mpRecv(w.d)}catch(e){}
      },

    for(const m of done){
      p.miss.splice(p.miss.indexOf(m),1);pts+=m.pts;p.done++;tx.push(TB[m.k].tx);
      p.log.unshift({k:m.k,pts:m.pts,d:localDate()});
    }
    p.log=p.log.slice(0,10);
    const b=addPoints(pts,tx.join(' · '));
    if(!p.fin)ensureMissions();
    mg.pts+=b.pts;tx.forEach(t=>mg.miss.push(t));
    toast('🎯 Missão concluída! +'+b.pts+' pts no Passe'+(b.xp?' · +'+b.xp+' XP':''),true);
    if(b.items.length||b.fin)Q.push(b);
  }
  save();
}

/* ---------- Ganchos chamados pelo jogo (cada um com try/catch no ponto de chamada) ---------- */
function onStrike(G){const s=G&&G.spin;spinNext=!!s&&Math.hypot(s.x||0,s.y||0)>0.12}
function onShot(res){
  const balls=(res.pocketed||[]).filter(b=>b.n>0),cnt=balls.length;
  match.pocketed+=cnt;if(res.foul)match.fouls++;
  const ev=[['shots',1,'add']];
  if(spinNext)ev.push(['spin',1,'add']);
  if(cnt){ev.push(['pocket',cnt,'add']);ev.push(['inmatch',match.pocketed,'max']);if(cnt>=2)ev.push(['multi',1,'add'])}
  if(res.winner===0&&balls.some(b=>b.n===8))ev.push(['eight',1,'add']);
  spinNext=false;
  applyEvents(ev);
}
function onMatchStart(){match={fouls:0,pocketed:0};mg={pts:0,miss:[]};spinNext=false;if(ensureMissions())save()}
function onMatchEnd(won){
  if(!won)return;
  const ev=[['win',1,'add']];if(match.fouls===0)ev.push(['clean',1,'add']);
  applyEvents(ev);
}
function decorateEnd(){
  if(!mg.pts)return;
  const box=document.querySelector('#modal .mbox'),btns=box&&box.querySelector('.mbtns');if(!btns)return;
  const p=P(),d=document.createElement('div');d.className='mrows';
  d.innerHTML='<div class="lv"><span>🎱 Passe Break Master</span><b>+'+mg.pts+' pts</b></div>'
    +mg.miss.map(t=>'<div><span>🎯 '+esc(t)+'</span><b>✓</b></div>').join('')
    +'<div><span>Progresso do passe</span><b>'+p.pts+' / 100</b></div>';
  box.insertBefore(d,btns);
}

/* ---------- Telas ---------- */
function pv(r){
  if(r.kind==='cue')return '<div class="pbpv"><canvas class="cuepv" data-cue="'+r.id+'" width="300" height="60"></canvas></div>';
  if(r.kind==='photo')return '<div class="pbpv ph"><div class="phpv phi-'+r.id+'" role="img" aria-label="'+r.label+'"></div></div>';
  const b=banOf(r.id);return '<div class="pbpv"><div class="banpv'+(b.fx?' hasfx':'')+'" style="background:'+b.bg+'">'+bfx(b)+'</div></div>';
}
SCREENS.pass=function(){
  if(ensureMissions())save();
  const p=P(),nx=MAIN.find(r=>r.at>p.pts);
  const seg=Array.from({length:10},(_,i)=>'<i><b style="width:'+Math.round(Math.max(0,Math.min(1,(p.pts-i*10)/10))*100)+'%"></b></i>').join('');
  const hero='<div class="card pbhero"><div class="pbt">🎱 PASSE BREAK MASTER 🎱</div>'
    +'<div class="pbpts"><span class="lbl" style="margin:0">Progresso</span><span><b>'+p.pts+'</b> / 100 PONTOS</span></div>'
    +'<div class="pbbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p.pts+'">'+seg+'</div>'
    +(nx?'<div class="pbnext"><span class="lbl" style="margin:0">Próxima recompensa</span><b>'+nx.ico+' '+nx.label+'</b><small>FALTAM '+(nx.at-p.pts)+' pontos</small></div>'
        :'<div class="pbnext done"><b>👑 PASSE CONCLUÍDO!</b><small>Todas as recompensas foram desbloqueadas.</small></div>')
    +'</div>';
  const mi=m=>{const t=TB[m.k],v=Math.min(m.pr||0,t.n);
    return '<div class="card goal pbms"><div class="gm"><div>'+t.ic+' '+t.tx+'</div><div class="bar"><i style="width:'+Math.round(v/t.n*100)+'%"></i></div><small>'+v+'/'+t.n+'</small></div><div class="pbpt">+'+m.pts+'<small>pontos</small></div></div>'};
  const miss=p.fin?'<div class="card pbms done"><div>🏆 Você completou o passe. Não há mais missões para pontuar.</div></div>'
    :'<div class="list">'+p.miss.map(mi).join('')+'</div>'
     +(p.log.length?'<p class="note">Concluídas: '+p.log.slice(0,3).map(l=>(TB[l.k]?TB[l.k].tx:'Missão')+' (+'+l.pts+')').join(' · ')+'</p>':'')
     +'<p class="note">As missões contam tacadas, bolas e vitórias reais das suas partidas e se renovam todo dia e quando você conclui uma.</p>';
  const rows=['<div class="pbn start st-c"><b class="pp">0</b><div class="pbx"><span>Início do passe</span><em>🎱</em></div></div>'];
  REW.forEach(r=>{
    const s=stateOf(p,r);
    if(!r.main){rows.push('<div class="pbn xp st-'+s+'"><b class="pp">'+r.at+'</b><div class="pbx"><span>+'+r.xp+' XP</span><em>'+(s==='c'?'✓':'🔒')+'</em></div></div>');return}
    const txt=s==='l'?'🔒 Bloqueado · faltam '+(r.at-p.pts)+' pts':s==='u'?'🔓 Desbloqueado':'✓ Coletado';
    const eq=isEq(r.kind,r.id);
    const btn=s==='l'?'':eq?'<button class="btn sm" disabled>Equipado</button>':'<button class="btn sm'+(s==='u'?' gold':'')+'" data-pb="eq:'+r.kind+':'+r.id+'">'+(s==='u'?'Coletar e equipar':'Equipar')+'</button>';
    rows.push('<div class="pbn main st-'+s+(r.epic?' epic':'')+'"><b class="pp">'+r.at+'</b><div class="card pbm">'+pv(r)
      +'<div class="pbi"><div class="iname">'+r.ico+' '+r.label+(r.epic?'<em class="lgd max">★ RECOMPENSA FINAL</em>':'')+'</div><small class="pbst">'+txt+'</small>'+btn+'</div></div></div>');
  });
  return '<section class="screen">'+topbar('Passe Break Master')+'<div class="scroll pbs">'+hero
    +'<h2>🎯 MISSÕES</h2>'+miss+'<h2>🏆 RECOMPENSAS</h2><div class="pbtr">'+rows.join('')+'</div></div></section>';
};
SCREENS.auth=function(){
  const login=authMode==='login';
  let adopt=false;if(!login){try{const a=accLoad();adopt=!a.legacy&&!!localStorage.getItem(LEG_KEY)}catch(e){}}
  return '<section class="screen auth"><div class="scroll"><div class="pbauth">'
   +'<div class="pbbrand"><span class="lobby-mark"><b>8</b></span><div><small>CLUBE PRIVADO</small><strong>SINUCA <i>POOL</i></strong></div></div>'
   +'<div class="card"><h2>'+(login?'ENTRAR':'CRIAR CONTA')+'</h2>'
   +'<label class="lbl" for="pbn">Nome completo</label><input id="pbn" class="inp" type="text" maxlength="40" autocomplete="username" autocapitalize="words" spellcheck="false" enterkeyhint="next">'
   +'<label class="lbl" for="pbp">Senha</label><input id="pbp" class="inp" type="password" maxlength="64" autocomplete="'+(login?'current-password':'new-password')+'" enterkeyhint="go">'
   +'<div id="pbmsg" class="rdmsg" role="alert"></div>'
   +'<button class="btn gold" id="pbgo" data-pb="'+(login?'login':'create')+'">'+(login?'ENTRAR':'CRIAR CONTA')+'</button>'
   +'<button class="btn" data-pb="mode:'+(login?'create':'login')+'">'+(login?'Criar uma conta nova':'Já tenho conta')+'</button>'
   +'<p class="note">'+(login?'Depois de entrar, este aparelho lembra da sua conta.':(adopt?'O progresso que você já tem neste aparelho será mantido na sua conta. ':'')+'Use pelo menos 6 caracteres na senha.')+'</p>'
   +'</div></div></div></section>';
};
const nameOf=()=>{try{const a=accLoad();return uid&&a.users[uid]?a.users[uid].name:(S.fullName||'')}catch(e){return ''}};

/* ---------- Recompensas: coletar/equipar e avisos ---------- */
function equip(kind,id){
  ensureOwn();
  if(!own(kind).includes(id))return false;
  if(kind==='cue')S.cue=id;else if(kind==='banner')S.banner=id;else{if(!S.avatar)S.avatar={i:0,photo:null};S.avatar.pid=id}
  const r=REW.find(x=>x.main&&x.kind===kind&&x.id===id),p=P();if(r&&p.got[r.key])p.col[r.key]=1;
  save();return true;
}
function showBatch(b){
  const m=$('#modal');
  if(b.fin){
    const it=banOf('epico'),conf=Array.from({length:26},(_,i)=>'<span class="pbc" style="left:'+((i*37)%100)+'%;animation-delay:'+((i%9)*0.35).toFixed(2)+'s;background:'+['#ffd45e','#ff7a1a','#fff1b0','#e02d12'][i%4]+'"></span>').join('');
    m.innerHTML='<div class="mbox win pbepic">'+conf
      +'<h2 style="font-size:30px">🔥 PASSE CONCLUÍDO! 🔥</h2><div class="pbtro">🏆 PARABÉNS! 🏆</div>'
      +'<p>Você completou o PASSE BREAK MASTER!</p><p class="pbfin">Recompensa final:</p>'
      +'<div class="banpv hasfx pbbig" style="background:'+it.bg+'">'+bfx(it)+'</div>'
      +'<div class="pbcrown">👑 BANNER ÉPICO 👑</div>'
      +'<div class="mbtns"><button class="btn" data-pb="ok">Continuar</button><button class="btn gold" data-pb="eqq:banner:epico">Equipar</button></div></div>';
    P().finSeen=true;save();
  }else{
    m.innerHTML='<div class="mbox win pbu"><h2 style="font-size:28px">🔓 Recompensa do passe!</h2><p>Passe Break Master · '+P().pts+' / 100 pontos</p>'
      +b.items.map(it=>{const r=REW.find(x=>x.main&&x.kind===it.kind&&x.id===it.id);
        return '<div class="pbui">'+pv(r)+'<div class="pbi"><div class="iname">'+it.ico+' '+it.label+'</div><small>'+(it.dup?'Você já tinha este item.':'Adicionado à sua conta.')+'</small>'
          +(it.dup?'':'<button class="btn gold sm" data-pb="eqq:'+it.kind+':'+it.id+'">Equipar</button>')+'</div></div>'}).join('')
      +'<div class="mbtns"><button class="btn" data-pb="ok">Continuar</button><button class="btn gold" data-pb="topass">Ver passe</button></div></div>';
  }
  m.hidden=false;drawCuePreviews();
  try{sfx.win()}catch(e){}
}
let flushTries=0;
function flush(){
  if(typeof S==='undefined'||!S||!Q.length||cur==='game'||cur==='auth')return;
  const m=$('#modal');
  if(!m.hidden){if(flushTries++<20)setTimeout(flush,600);return}
  flushTries=0;showBatch(Q.shift());
}
function afterGo(name){if(name!=='game'&&name!=='auth')setTimeout(flush,250)}

/* ---------- Contas: criar, entrar, sessão, sair ---------- */
function enter(id,newName){
  uid=id;KEY=LEG_KEY+':u:'+id;S=load();
  const a=accLoad(),u=a.users[id];
  if(u)S.fullName=u.name;
  if(newName&&S.name==='Jogador')S.name=newName.slice(0,14); /* só em conta nova (sem progresso herdado) */
  ensureOwn();const p=P();
  const b={items:[],xp:0,levels:0};grant(p,b); /* garante que nada alcançado ficou sem entregar */
  ensureMissions();
  if(p.fin&&!p.finSeen)Q.push({fin:true,items:[],pts:0,xp:0,levels:0});
  save();
}
function finishLogin(a,id,newName){
  const token=randHex(24),u=a.users[id];
  u.tok=toHex(sha256b(utf8(token)));u.fail=null;a.session={uid:id,token};
  const ok=accSave(a);
  enter(id,newName);
  if(!ok)toast('Não foi possível lembrar esta sessão neste navegador');
  go('menu');
}
async function submit(){
  const nEl=$('#pbn'),pEl=$('#pbp'),btn=$('#pbgo');if(!nEl||!pEl||!btn)return;
  const create=authMode==='create',full=cleanName(nEl.value),pw=pEl.value;
  const say=t=>{const m=$('#pbmsg');if(m)m.textContent=t};
  if(full.length<3){say('Digite seu nome completo (mínimo 3 letras).');return}
  if(!pw){say('Digite a senha.');return}
  if(create&&pw.length<6){say('A senha precisa ter pelo menos 6 caracteres.');return}
  if(!storageOK()){say('Este navegador bloqueou o salvamento. Ative o armazenamento para criar conta.');return}
  const label=btn.textContent;btn.disabled=true;btn.textContent='Aguarde...';say('');
  const restore=()=>{const b2=$('#pbgo');if(b2){b2.disabled=false;b2.textContent=label}};
  try{
    const nk=normName(full),id=uidOf(nk);
    if(create){
      let a=accLoad();
      if(a.users[id]){say('Já existe uma conta com esse nome. Toque em "Já tenho conta" para entrar.');restore();return}
      const salt=randHex(16),hash=await pbkdf2Hex(pw,salt,ITER);
      a=accLoad();
      if(a.users[id]){say('Já existe uma conta com esse nome.');restore();return}
      a.users[id]={id,name:full,salt,iter:ITER,hash,created:Date.now(),tok:''};
      let adopted=false;const nkey=LEG_KEY+':u:'+id;
      if(!a.legacy){ /* a primeira conta do aparelho herda o progresso que já existia (nada se perde) */
        try{const raw=localStorage.getItem(LEG_KEY);if(raw&&JSON.parse(raw)&&!localStorage.getItem(nkey)){localStorage.setItem(nkey,raw);adopted=true}}catch(e){}
        a.legacy=true;
      }
      if(!accSave(a)){say('Não foi possível salvar a conta neste navegador.');restore();return}
      finishLogin(a,id,adopted?'':full);
    }else{
      const a=accLoad(),u=a.users[id],now=Date.now();
      if(u&&u.fail&&u.fail.until>now){say('Muitas tentativas. Aguarde '+Math.ceil((u.fail.until-now)/1000)+' s.');restore();return}
      const ok=u?ctEq(await pbkdf2Hex(pw,u.salt,u.iter||ITER),u.hash):(await pbkdf2Hex(pw,'00'.repeat(16),ITER),false);
      if(!ok){
        if(u){const n=((u.fail&&u.fail.n)||0)+1;u.fail={n,until:n>=5?now+Math.min(300,30*(n-4))*1000:0};accSave(a)}
        say('Nome ou senha incorretos.');restore();return;
      }
      finishLogin(a,id);
    }
  }catch(e){say('Algo deu errado. Tente de novo.');restore()}
}
function logoutAsk(){
  const m=$('#modal');
  m.innerHTML='<div class="mbox"><h2>Sair da conta?</h2><p>Seu progresso continua salvo na conta '+esc(nameOf())+'. Para voltar, entre com nome e senha.</p>'
    +'<div class="mbtns"><button class="btn" data-pb="logout-no">Cancelar</button><button class="btn bad" data-pb="logout-yes">Sair</button></div></div>';
  m.hidden=false;
}
function logout(){
  save();
  try{const a=accLoad();a.session=null;if(uid&&a.users[uid])a.users[uid].tok='';accSave(a)}catch(e){}
  uid=null;Q.length=0;stopLoop();
  $('#modal').hidden=true;authMode='login';go('auth');
}
function boot(){
  if(!storageOK()){go('menu');return} /* sem armazenamento não há como manter contas: joga como antes */
  try{
    const a=accLoad(),s=a.session,u=s&&a.users[s.uid];
    if(u&&s.token&&u.tok&&ctEq(toHex(sha256b(utf8(String(s.token)))),u.tok)){enter(s.uid);go('menu');return}
    authMode=Object.keys(a.users).length?'login':'create';
  }catch(e){authMode='create'}
  go('auth');
}

/* ---------- Eventos de tela ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('[data-pb]');if(!el||el.disabled)return;
  try{sfx.ui()}catch(_){}
  const a=el.dataset.pb;
  if(a==='create'||a==='login'){submit();return}
  if(a.indexOf('mode:')===0){authMode=a.slice(5);go('auth');return}
  if(a==='logout'){logoutAsk();return}
  if(a==='logout-no'){$('#modal').hidden=true;return}
  if(a==='logout-yes'){logout();return}
  if(a==='ok'){$('#modal').hidden=true;if(cur==='pass'||cur==='menu')refresh();setTimeout(flush,250);return}
  if(a==='topass'){$('#modal').hidden=true;go('pass');return}
  if(a.indexOf('eq:')===0||a.indexOf('eqq:')===0){
    const parts=a.split(':');
    if(equip(parts[1],parts[2])){
      toast('Equipado',true);
      if(parts[0]==='eqq'){$('#modal').hidden=true;setTimeout(flush,250)}
      if(cur==='pass'||cur==='menu')refresh();
    }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const t=e.target;
  if(t&&t.id==='pbn'){e.preventDefault();const p=$('#pbp');if(p)p.focus()}
  else if(t&&t.id==='pbp'){e.preventDefault();const b=$('#pbgo');if(b)b.click()}
});

return {boot,afterGo,onStrike,onShot,onMatchStart,onMatchEnd,decorateEnd,
  navBtn(){const p=P();return '<button class="lobby-action" data-go="pass">'+(hasNew()?'<b class="lobby-dot"></b>':'')
    +'<span class="lobby-ico">🎱</span><span><b>Passe Break Master</b><small>'+p.pts+' / 100 pontos</small></span><i>›</i></button>'},
  settingsCard(){const n=nameOf();if(!uid)return '';
    return '<div class="card"><div class="lbl">Conta</div><div class="iname">'+esc(n)+'</div><p class="note" style="margin:4px 0 10px">Seu progresso fica salvo nesta conta, neste aparelho.</p><button class="btn" data-pb="logout">Sair da conta</button></div>'},
  
};
})();

try{PB.boot()}catch(e){go('menu')}
</script>
